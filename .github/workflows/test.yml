name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Run pytest
        # No .env in CI, and none wanted: tests/conftest.py sets fake
        # credentials before the first api_utils import
        run: uv run --group dev pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Vitest
        run: npm test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # --with-deps only on a cache miss; the system libraries it installs
        # are not what the cache holds
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        # Builds and starts Next itself, against the demo fixture only, so no
        # secrets are involved
        run: npm run test:e2e

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  demo-fixture:
    name: Demo fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - run: npm ci

      - name: Check the demo fixture still matches the API
        # Regenerates the fixture and replays every endpoint payload against
        # the TypeScript rebuild at eight anchor dates. Needs both toolchains,
        # which is why it is its own job.
        run: npm run check:demo
