name: Tests

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch makes the in-flight run obsolete
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Not 20: it reached end of life in April 2026, and undici (bundled by Next)
  # calls worker_threads.markAsUncloneable, which landed in 22.10 and was
  # never backported. On 20 the suite still passes but throws nine unhandled
  # errors. 22 also satisfies Vite 8's >=22.12 floor.
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"

jobs:
  python:
    name: Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - name: Run pytest
        # No .env in CI, and none wanted: tests/conftest.py sets fake
        # credentials before the first api_utils import
        run: uv run --group dev pytest -q

  web:
    name: Web
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run Vitest
        run: npm test

  e2e:
    name: End to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Chromium
        # --with-deps only on a cache miss; the system libraries it installs
        # are not what the cache holds
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        # Builds and starts Next itself, against the demo fixture only, so no
        # secrets are involved
        run: npm run test:e2e

      - uses: actions/upload-artifact@v5
        # Only on failure: on a green run there is nothing worth keeping
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  demo-fixture:
    name: Demo fixture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - run: npm ci

      - name: Check the demo fixture still matches the API
        # Regenerates the fixture and replays every endpoint payload against
        # the TypeScript rebuild at eight anchor dates. Needs both toolchains,
        # which is why it is its own job.
        #
        # The generator imports api.index, so api_utils.config and the
        # Supabase client are built at import time and need settings to exist.
        # Locally those come from .env; here they are fakes, and nothing in
        # this path makes a network call. Same values as tests/conftest.py.
        env:
          SUPABASE_PROJECT_URL: https://test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: test-service-role-key
          ENCRYPTION_KEY: "00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff"
          NEXT_PUBLIC_SESSION_COOKIE_NAME: sessionId
          NEXT_PUBLIC_FM_API_URL: https://api.focusmate.test
          NEXT_PUBLIC_FM_API_PROFILE_ENDPOINT: /v1/me
          NEXT_PUBLIC_FM_API_SESSIONS_ENDPOINT: /v1/sessions
        run: npm run check:demo
